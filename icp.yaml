networks:
  - name: local
    mode: managed
    gateway:
      port: 8001

canisters:
  - name: block_explorer
    recipe:
      # Pinned to commit 750f334 on our fork's idl-option-v5 branch — same
      # as upstream dfinity/icp-cli-recipes@main (which uses mops build and
      # supports [optimize] in mops.toml), plus a minimal `idl` option that
      # copies the generated .did out of mops's build dir to a predictable
      # path (used by `icp canister call` and by occasional `didc bind`
      # regen of the body-uploader's TS bindings).
      type: "https://raw.githubusercontent.com/research-ag/icp-cli-recipes/750f334/recipes/motoko/recipe.hbs"
      configuration:
        idl: .icp/cache/artifacts/block_explorer.did
  - name: header_fetcher
    recipe:
      type: "https://raw.githubusercontent.com/research-ag/icp-cli-recipes/idl-option/recipes/motoko/recipe.hbs"
      configuration:
        main: src/header_fetcher/header_fetcher.mo
        idl: .icp/cache/artifacts/header_fetcher.did
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.4.1"
      configuration:
        dir: frontend
