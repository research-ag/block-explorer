[package]
name = "btc"
version = "0.1.0"
description = "Bitcoin primitives for Motoko: header parsing and consensus validation, compact-difficulty math, chain work, median-time-past, retargeting and double-SHA256. Storage-agnostic; SPV today, room for full-node pieces later."
repository = "https://github.com/research-ag/block-explorer"
keywords = ["bitcoin", "spv", "header", "consensus"]
license = "MIT"

[toolchain]
moc = "2.2.4"
wasmtime = "36.0.9"

[dependencies]
core = "2.7.0"
sha2 = "0.3.3"

[dev-dependencies]
test = "2.1.2"
bench-helper = "0.0.4"
